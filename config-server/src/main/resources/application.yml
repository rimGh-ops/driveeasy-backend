spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        # ============================================================
        # MODE GIT (PRODUCTION) : pointer sur GitHub
        # Décommenter et remplacer TON_USER par votre username GitHub
        # ============================================================
        # git:
        #   uri: https://github.com/TON_USER/driveeasy-config-repo
        #   default-label: main
        #   clone-on-start: true

        # ============================================================
        # MODE NATIF (LOCAL) : fichiers YAML embarqués dans classpath
        # ============================================================
        native:
          search-locations: classpath:/config

  profiles:
    active: native

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
